name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Select version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      - name: Install Release Tools
        run: npm install release-it @release-it/keep-a-changelog

      - name: Run Release It
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME="release/v${CURRENT_VERSION}-to-${{ github.event.inputs.increment }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME
          # Run release-it to modify CHANGELOG.md and package.json locally
          npx -y --no-package-json -p release-it -p @release-it/keep-a-changelog \
            release-it ${{ github.event.inputs.increment }} --ci \
            --git.requireCleanWorkingDir=false \
            --git.requireUpstream=false
            --plugins.@release-it/keep-a-changelog.filename=CHANGELOG.md \
            --git.commitMessage='chore(release): v${version}' \
            --git.tag=false \
            --git.push=false \
            --npm.skipChecks=true \
            --npm.publish=false \
            
          git push origin $BRANCH_NAME
          
          NEW_VERSION=$(node -p "require('./package.json').version")
          
          gh pr create \
            --title "chore(release): v${NEW_VERSION}" \
            --body "This PR was generated by running the **Prepare Release** pipeline manual trigger. Merging this PR will automatically cut a GitHub Release and publish version \`v${NEW_VERSION}\` to public npm." \
            --base main \
            --head $BRANCH_NAME
