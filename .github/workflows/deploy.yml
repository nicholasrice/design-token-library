name: Deploy to GitHub Pages

# Publish docs only when a GitHub Release is published, so the site matches a
# released npm version (not unreleased main).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - run: npm ci
      - run: npm run build
      - run: npm run docs:api-reference

      - name: Install dependencies
        working-directory: ./doc-site
        run: npm ci

      - name: Build website
        working-directory: ./doc-site
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc-site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
