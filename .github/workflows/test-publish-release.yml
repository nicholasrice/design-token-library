name: Test Publish Release

# Change the trigger to manual UI button instead of PR closed/merged
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract Changelog Notes
        id: parse_changelog
        uses: anton-pyshchev/changelog-parser-action@v2
        with:
          input_file: 'CHANGELOG.md'

      # Safety feature: Creates a "Pre-release/Draft" on GitHub so it's hidden
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}-test
          name: Test Release v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.parse_changelog.outputs.latest_version_body }}
          draft: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npmjs.org'

      - name: Build
        run: |
          npm ci
          npm run build

      # Safety feature: --dry-run validates your NPM_TOKEN but won't upload any code
      - name: Publish Package to npm
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
