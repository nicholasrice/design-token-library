name: Test Publish Release

# Change the trigger to manual UI button instead of PR closed/merged
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Version
        id: get_version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract Changelog Notes
        id: parse_changelog
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          CHANGELOG_TEXT=$(node -e "
            const fs = require('fs');
            const file = fs.readFileSync('CHANGELOG.md', 'utf8');
            // Locate the section starting with your new version header
            const lines = file.split('\n');
            let capturing = false;
            let notes = [];
            
            for (const line of lines) {
              if (line.trim().startsWith('## [' + '$VERSION' + ']')) {
                capturing = true;
                continue;
              }
              // Stop capturing when encountering the next version header
              if (capturing && line.trim().startsWith('## [')) {
                break;
              }
              if (capturing) {
                notes.push(line);
              }
            }
            console.log(notes.join('\n').trim());
          ")
          
          # Save multi-line notes safely to the GitHub output buffer
          echo "latest_version_body<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_TEXT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Safety feature: Creates a "Pre-release/Draft" on GitHub so it's hidden
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}-test
          name: Test Release v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.parse_changelog.outputs.latest_version_body }}
          draft: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://npmjs.org'

      - name: Build
        run: |
          npm ci
          npm run build

      # Safety feature: --dry-run validates your NPM_TOKEN but won't upload any code
      - name: Publish Package to npm
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
